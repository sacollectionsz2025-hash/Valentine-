<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 90%;
      animation: fadeIn 2s ease;
    }

    h1 {
      color: #e63946;
      font-size: 32px;
    }

    p {
      color: #444;
      font-size: 18px;
      line-height: 1.6;
      margin: 20px 0;
    }

    .buttons {
      margin-top: 25px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
      transition: 0.3s;
    }

    .yes {
      background: #e63946;
      color: white;
    }

    .yes:hover {
      background: #c71f2d;
      transform: scale(1.1);
    }

    .no {
      background: #ddd;
      color: #555;
      position: relative;
      transition: 0.3s;
    }

    .no:hover {
      transform: translateX(60px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      color: red;
      font-size: 20px;
      animation: float 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes float {
      0% { transform: translateY(100vh); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="hearts" id="hearts"></div>
  
  <!-- Background Music -->
  <audio id="loveMusic" loop>
    <source src="adi_penne.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Voice Message -->
  <audio id="voiceMsg">
    <source src="voice of mine .m4a" type="audio/mp4">
    Your browser does not support the audio element.
  </audio>

  <div class="card">
    <h1>Hey Raja ❤️</h1>
    <p>
      From every smile to every memory,
      you make my world brighter.
      Life is more beautiful with you in it. 💫
    </p>

    <p><strong>Will you be my Valentine? 🌹</strong></p>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes 💖</button>
      <button class="no" id="noBtn">No 🙈</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');

    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    function sayYes() {
      // Play romantic music
      const music = document.getElementById('loveMusic');
      const voice = document.getElementById('voiceMsg');

      music.play();

      // Play voice message after 2 seconds
      setTimeout(() => {
        voice.play();
      }, 2000);
      document.querySelector('.card').innerHTML = `
        <h1>Yayyy!!! 💕🎉</h1>
        <p>
          You just made me the happiest person alive! 😍<br>
          Thank you for being my Valentine! 💖<br><br>
          <strong>Raja, I love you so much ❤️</strong>
        </p>
        <p>Forever us 💫</p>
      `;
      createHearts();
      startSecretMessage();
      startSparkles();
    }

    function startSecretMessage() {
      setTimeout(() => {
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.background = 'rgba(0,0,0,0.6)';
        overlay.style.display = 'flex';
        overlay.style.justifyContent = 'center';
        overlay.style.alignItems = 'center';
        overlay.style.zIndex = '10000';

        const letter = document.createElement('div');
        letter.style.background = '#fffafc';
        letter.style.padding = '25px 22px';
        letter.style.borderRadius = '20px';
        letter.style.maxWidth = '350px';
        letter.style.width = '90%';
        letter.style.boxShadow = '0 10px 25px rgba(0,0,0,0.3)';
        letter.style.textAlign = 'center';
        letter.style.animation = 'fadeIn 1s ease';

        letter.innerHTML = `
          <h2 style="color:#e63946;">💌 My Love Letter</h2>
          <p style="font-size:17px;line-height:1.6;color:#444;">
            My dear Raja ❤️,<br><br>
            From the day you came into my life,
            everything became more beautiful.
            Your smile is my favorite view,
            your voice is my comfort,
            and your love is my strength. 💖<br><br>

            No matter where life takes us,
            I promise to stand beside you,
            support you, and love you
            more and more every day. 💫<br><br>

            You are my today,
            my tomorrow,
            and my forever. 💍❤️
          </p>
          <button id="closeLetter" style="margin-top:15px;padding:8px 18px;border:none;border-radius:20px;background:#e63946;color:white;font-size:14px;cursor:pointer;">Close 💕</button>
        `;

        overlay.appendChild(letter);
        document.body.appendChild(overlay);

        document.getElementById('closeLetter').onclick = () => {
          overlay.remove();
        };
      }, 10000);
    }

    function startSparkles() {
      setInterval(() => {
        const sparkle = document.createElement('div');
        sparkle.innerHTML = '✨';
        sparkle.style.position = 'fixed';
        sparkle.style.left = Math.random() * 100 + 'vw';
        sparkle.style.top = Math.random() * 100 + 'vh';
        sparkle.style.fontSize = '20px';
        sparkle.style.opacity = '0.8';
        sparkle.style.pointerEvents = 'none';
        document.body.appendChild(sparkle);

        setTimeout(() => sparkle.remove(), 1500);
      }, 300);
    }

    function createHearts() {
      const heartsContainer = document.getElementById('hearts');

      setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '❤️';

        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';

        heartsContainer.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 6000);

      }, 200);
    }
  </script>

</body>
</html>
